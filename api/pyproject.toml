[project]
name = "call-me-api"
version = "1.0.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "aiohttp>=3.10.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "livekit-api>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
