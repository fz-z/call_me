[project]
name = "call-me-agent"
version = "1.0.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    "livekit-agents[openai,silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "dashscope>=1.25.6",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
