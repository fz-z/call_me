services:
  api:
    build: ./api
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - api_data:/data
      - ./web-admin/dist:/app/static

  agent:
    build: ./agent
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8000
      # WORKER_INTERNAL_SECRET 从 .env 注入，用于拉取运行时密钥

volumes:
  api_data:
